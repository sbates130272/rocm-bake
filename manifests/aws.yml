---
# A build-only fleet on EC2.
#
#   FLEET=aws make list-nodes
#   FLEET=aws ansible-playbook -i inventory/fleet.py site.yml
#
# Nothing here provisions anything. The manifest describes instances
# that already exist; see docs/operations/aws.md for the instance
# types, the storage and the reasoning behind both.
#
# Build-only is not a simplification, it is the hardware: EC2 has no
# AMD Instinct or Radeon instance, so no node can declare the `gpu`
# capability and `gpu_node:` is absent. Every target still builds —
# the fleet cross-compiles for gfx950 already, and no node on SNOC has
# that card either — but `make gpu-test` and the serving stack have
# nowhere to land and say so rather than failing obscurely.
#
# Addresses are the placeholders a provisioning run replaces. Keep them
# resolvable from the control host: private DNS inside the VPC, or
# tailnet names if the instances join the same tailnet as everything
# else, which is the smaller change.

name: aws

# Route53 private zone for the VPC, or the tailnet domain if the
# instances join one. Build steps get it as a DNS search domain.
domain: rocm-bake.internal

default_builder: aws-build-1
pool_builder: aws-pool
bench_node: aws-build-1

# No gpu_node: EC2 has no AMD accelerator instance. See the header.

registry:
  node: aws-services
  port: 8080
  # Nothing else owns a registry here, so the Ansible role installs and
  # runs Zot rather than merely verifying one.
  managed: true
  mirrors:
    - docker.io
    - ghcr.io
    - quay.io

cache:
  node: aws-services
  port: 8081
  dir: /var/cache/sccache-webdav
  # No tailnet to bind to by default: the store listens on the
  # instance's VPC address, reachable from the builders' security
  # group and nothing else.
  bind: private

network:
  no_proxy:
    - localhost
    - 127.0.0.1
    - "::1"
    - .rocm-bake.internal
    - .ts.net
    - 10.0.0.0/8
    - 169.254.169.254
  # The VPC resolver (.2 of the VPC CIDR) first, so private names
  # resolve inside a build step; a public resolver after it, because
  # the VPC resolver answers for everything but a build step that
  # cannot reach apt or pip is no use.
  nameservers:
    - 10.0.0.2
    - 169.254.169.253

buildkit:
  max_parallelism: 10
  # Builders here have far more disk than the SNOC nodes, and pulling
  # an 8.67GB base layer again is the thing worth avoiding.
  gc_keep_storage: 250GB
  step_log_max_size: 104857600
  step_log_max_speed: 10485760

nodes:
  # The services node: registry, compiler cache, and the metrics the
  # perf report plots. Deliberately not a builder — it is what every
  # builder is waiting on, and a compile that takes its cores makes
  # every other node slower.
  - name: aws-services
    host: services.rocm-bake.internal
    connection: ssh
    platform: m8i.2xlarge
    capabilities: [registry, cache, metrics]
    # EBS-backed, so this is the volume's provisioned throughput
    # rather than a network limit.
    link_mbps: 1000

  # Builders. Every link_mbps is the same here, which is the point:
  # the SNOC fleet's uplinks differ by a factor of 25 and the
  # scheduler has to charge a 6 GB cache export against them. Inside
  # one placement group they do not differ, so balance.sh's placement
  # collapses to plain LPT on build time.
  - name: aws-build-1
    host: build-1.rocm-bake.internal
    connection: ssh
    platform: m8a.16xlarge
    capabilities: [build, metrics]
    link_mbps: 1500

  - name: aws-build-2
    host: build-2.rocm-bake.internal
    connection: ssh
    platform: m8a.16xlarge
    capabilities: [build, metrics]
    link_mbps: 1500

  - name: aws-build-3
    host: build-3.rocm-bake.internal
    connection: ssh
    platform: m8a.16xlarge
    capabilities: [build, metrics]
    link_mbps: 1500
