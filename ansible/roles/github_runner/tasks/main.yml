---
# A GitHub Actions self-hosted runner, as a systemd service, on a node
# the manifest declares `runner`.
#
# It exists for the CI jobs that cannot work anywhere else: the
# `docker build` checks pull their base image from the fleet's Zot over
# the tailnet, which a GitHub-hosted runner cannot resolve. See the
# comment where those jobs live in .github/workflows/ci.yml.
#
# The registration token is minted on the *control host* and handed
# over; the GitHub App's private key never reaches a build node.

- name: A checksum is known for this runner version
  ansible.builtin.assert:
    that: github_runner_sha256 | length == 64
    fail_msg: >-
      No SHA-256 recorded for runner {{ github_runner_version }}. Add it
      to github_runner_sha256_by_version in
      ansible/roles/github_runner/defaults/main.yml — the comment there
      has the gh command that prints it.
    quiet: true

- name: Install directory
  become: true
  ansible.builtin.file:
    path: "{{ github_runner_install_dir }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0755"

- name: Work directory
  become: true
  ansible.builtin.file:
    path: "{{ github_runner_work_dir }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0755"

# unarchive's own `creates:` is what keeps this idempotent; the
# checksum is verified on every run that actually downloads.
- name: Runner tarball is unpacked, version {{ github_runner_version }}
  become: true
  become_user: "{{ github_runner_user }}"
  ansible.builtin.unarchive:
    src: >-
      https://github.com/actions/runner/releases/download/v{{
      github_runner_version }}/actions-runner-linux-x64-{{
      github_runner_version }}.tar.gz
    dest: "{{ github_runner_install_dir }}"
    remote_src: true
    checksum: "sha256:{{ github_runner_sha256 }}"
    creates: "{{ github_runner_install_dir }}/config.sh"

- name: The runner's own dependencies
  become: true
  ansible.builtin.command:
    cmd: ./bin/installdependencies.sh
    chdir: "{{ github_runner_install_dir }}"
    creates: "{{ github_runner_install_dir }}/.dependencies-installed"

- name: Mark dependencies as installed
  become: true
  ansible.builtin.file:
    path: "{{ github_runner_install_dir }}/.dependencies-installed"
    state: touch
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# Already registered? `.runner` holds the name and labels the runner
# configured with. Re-running config.sh on every apply would churn the
# registration and, with --replace, briefly drop a runner that might be
# mid-job.
- name: Existing registration, if any
  become: true
  ansible.builtin.slurp:
    src: "{{ github_runner_install_dir }}/.runner"
  register: github_runner_existing
  failed_when: false
  changed_when: false

- name: What it is registered as now
  ansible.builtin.set_fact:
    github_runner_current: >-
      {{ (github_runner_existing.content | b64decode | from_json)
         if github_runner_existing.content is defined else {} }}

# On the control host, so the App key stays there. no_log because the
# registration token is a credential, short-lived or not.
- name: A registration token, from the GitHub App
  ansible.builtin.command:
    cmd: >-
      python3 -I {{ playbook_dir }}/../.builders/gh-app-token.py
      --registration-token --repo {{ fleet_runner_repo }}
  delegate_to: localhost
  become: false
  register: github_runner_token
  changed_when: false
  no_log: true
  when: github_runner_current.agentName | default('') != inventory_hostname

- name: Registered with {{ fleet_runner_repo }}
  become: true
  become_user: "{{ github_runner_user }}"
  ansible.builtin.command:
    cmd: >-
      ./config.sh --unattended --replace
      --url https://github.com/{{ fleet_runner_repo }}
      --token {{ github_runner_token.stdout }}
      --name {{ inventory_hostname }}
      --labels {{ fleet_runner_labels | join(',') }}
      --work {{ github_runner_work_dir }}
    chdir: "{{ github_runner_install_dir }}"
  no_log: true
  when: github_runner_current.agentName | default('') != inventory_hostname
  # The `when:` above is the idempotence: this only runs when the node
  # is not already registered under this name, and when it does run it
  # has genuinely changed the registration.
  changed_when: true
  notify: Restart github_runner

- name: Installed as a service
  become: true
  ansible.builtin.command:
    cmd: ./svc.sh install {{ github_runner_user }}
    chdir: "{{ github_runner_install_dir }}"
    creates: /etc/systemd/system/actions.runner.*.service

- name: Service name
  become: true
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "actions.runner.*.service"
  register: github_runner_unit

- name: Running
  become: true
  ansible.builtin.systemd:
    name: "{{ github_runner_unit.files[0].path | basename }}"
    state: started
    enabled: true
    daemon_reload: true
  when: github_runner_unit.files | length > 0
