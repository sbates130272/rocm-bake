---
# The account the runner service runs as. Not root: a job is
# repository code, and the runner's own installer refuses to configure
# as root for exactly that reason. It does need to be in the `docker`
# group to reach the daemon, which is the point of running jobs here
# rather than on a GitHub-hosted runner.
github_runner_user: "{{ ansible_user_id }}"

# Where config.sh and svc.sh live, and where a job checks out its
# working copy. Kept apart because the work directory is disposable
# and the installation is not.
github_runner_install_dir: "{{ fleet_runner_install_dir }}"
github_runner_work_dir: "{{ fleet_runner_work_dir }}"

# Pinned, not "latest". The runner self-updates in place when GitHub
# asks it to, so this is a floor rather than a ceiling — but a bare
# "latest" would make the URL unreproducible and the checksum below
# impossible to state.
github_runner_version: "{{ fleet_runner_version }}"

# The SHA-256 GitHub publishes on the release page for
# actions-runner-linux-x64-<version>.tar.gz. Not decoration: this
# tarball is unpacked by a user in the `docker` group, which is a
# straight path to root on a build node, so an unverified download is
# not an option. Adding a version here means reading its checksum off
# the release:
#
#   gh api repos/actions/runner/releases/tags/v<version> --jq .body \
#     | grep 'SHA linux-x64'
#
# get_url fails the task on a mismatch; an empty string here would
# silently skip the check, so the role asserts it is set.
#
# Each line carries `# pre-commit: ignore`. A 64-character hex string
# in an assignment is exactly what the secret scanner is built to
# catch, and it is right to ask — these are published checksums for a
# public tarball, which is the opposite of a secret, but nothing about
# their shape says so. Keep the annotation on every version added.
github_runner_sha256_by_version:
  "2.338.2": "baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40"  # pre-commit: ignore

github_runner_sha256: >-
  {{ github_runner_sha256_by_version[github_runner_version] | default('') }}
