---
# Zot: the fleet's OCI registry. It holds the published images, the
# BuildKit layer cache as OCI artifacts, and a pull-through mirror of
# the upstreams.
#
# Two modes, chosen by `registry.managed:` in the manifest, because the
# two fleets genuinely differ:
#
#   managed: false  On SNOC, zot.service is deployed and owned outside
#                   this repository and other services pull through it.
#                   Starting a second one would be actively harmful, so
#                   this role only verifies.
#   managed: true   On a fleet stood up for building — a cloud one —
#                   nothing else owns it, and it has to be installed.

- name: Verify a registry this repository does not own
  when: not fleet_registry_managed
  block:
    - name: Zot service is active
      become: true
      # noqa command-instead-of-module
      # The systemd module cannot ask without being told a state, and
      # any state it is told is a state it will enforce. This branch
      # exists precisely because the service is not ours to touch.
      ansible.builtin.command: systemctl is-active zot
      register: registry_zot_active
      changed_when: false
      failed_when: false

    - name: Report an unmanaged registry that is not running
      ansible.builtin.fail:
        msg: >-
          zot.service on {{ inventory_hostname }} is
          {{ registry_zot_active.stdout | default('absent') }}, and this
          manifest says registry.managed is false — so this play will not
          start it. Bring it up where it is owned, or set managed: true
          to have this role install one.
      when: registry_zot_active.stdout != "active"

    # Zot's default is 60 seconds, and the ROCm base image's largest
    # layer is 8.67 GB — which cannot cross a 1 Gb/s link inside it.
    # The push then dies at exactly 60 seconds with a message that
    # names neither the timeout nor the layer.
    - name: Read timeout is long enough for the ROCm base layers
      become: true
      ansible.builtin.slurp:
        src: /etc/zot/config.json
      register: registry_zot_config
      failed_when: false

    - name: Warn when the read timeout is short
      ansible.builtin.debug:
        msg: >-
          /etc/zot/config.json on {{ inventory_hostname }} has no
          http.readTimeout in minutes or hours. Pushing the ROCm base
          image will fail at exactly 60 seconds. Set readTimeout and
          writeTimeout to 30m.
      when: >-
        registry_zot_config.content is not defined
        or (registry_zot_config.content | b64decode | from_json).get('http', {}).get('readTimeout', '')
           is not search('[mh]$')

- name: Install and manage the registry
  when: fleet_registry_managed
  block:
    - name: Zot binary
      become: true
      ansible.builtin.get_url:
        url: >-
          https://github.com/project-zot/zot/releases/download/{{ registry_zot_version }}/zot-linux-amd64
        dest: /usr/local/bin/zot
        mode: "0755"
      notify: Restart zot

    - name: Zot user and storage
      become: true
      ansible.builtin.user:
        name: zot
        system: true
        shell: /usr/sbin/nologin
        home: "{{ registry_zot_storage }}"
        create_home: true

    - name: Storage directory
      become: true
      ansible.builtin.file:
        path: "{{ registry_zot_storage }}"
        state: directory
        owner: zot
        group: zot
        mode: "0755"

    - name: Configuration directory
      become: true
      ansible.builtin.file:
        path: /etc/zot
        state: directory
        mode: "0755"

    # Zot writes here instead of stdout, so its request log never
    # reaches journald or syslog. See registry_zot_log_file for the
    # 88GB of /var/log/syslog that made this necessary.
    - name: Log directory
      become: true
      ansible.builtin.file:
        path: "{{ registry_zot_log_file | dirname }}"
        state: directory
        owner: zot
        group: zot
        mode: "0755"

    # Bounds the file whatever the level. Without this, raising
    # registry_zot_log_level back to info to debug something would
    # refill the disk exactly as before, just in a different path.
    - name: Log rotation
      become: true
      ansible.builtin.copy:
        dest: /etc/logrotate.d/zot
        mode: "0644"
        content: |
          {{ registry_zot_log_file }} {
              daily
              rotate 7
              maxsize 200M
              missingok
              notifempty
              compress
              delaycompress
              copytruncate
              su zot zot
          }

    - name: Configuration
      become: true
      ansible.builtin.template:
        src: config.json.j2
        dest: /etc/zot/config.json
        mode: "0644"
      notify: Restart zot

    - name: Service unit
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/zot.service
        mode: "0644"
        content: |
          # Managed by ansible/roles/registry
          [Unit]
          Description=OCI registry (zot)
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=zot
          ExecStart=/usr/local/bin/zot serve /etc/zot/config.json
          Restart=on-failure
          # The base image's layers are large and the GC walks all of
          # them; the default 90s stop timeout kills it mid-sweep.
          TimeoutStopSec=300

          [Install]
          WantedBy=multi-user.target
      notify: Restart zot

    - name: Zot is running
      become: true
      ansible.builtin.systemd:
        name: zot
        state: started
        enabled: true
        daemon_reload: true

- name: The registry answers
  ansible.builtin.uri:
    url: "http://{{ fleet_registry }}/v2/"
    status_code: [200, 401]
  delegate_to: localhost
  become: false
  retries: 5
  delay: 3
