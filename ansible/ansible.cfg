# Ansible reads this when run from the ansible/ directory, which is the
# only supported way to run these plays — the inventory path, the roles
# path and the manifest lookup are all relative to it.
[defaults]
inventory = inventory/fleet.py
roles_path = roles
host_key_checking = False
# Not `stdout_callback = yaml`: that was community.general's callback
# and it was removed in that collection's 12.0.0. The same output is
# an option on the built-in default callback.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

# The plays reach machines that are reachable as `ssh <host>` from
# here, exactly as buildx does — same names, same keys, same config.
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o BatchMode=yes
