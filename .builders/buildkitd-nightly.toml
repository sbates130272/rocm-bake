# Buildkit daemon configuration for the AWS nightly's builder.
#
# NOT buildkitd.toml.in. That one is a template rendered per fleet node
# by fleet.py — it carries MagicDNS resolvers, the tailnet Zot, and
# per-node parallelism, none of which exist on a rented CodeBuild
# machine. This is a static file for a machine that has one builder, no
# tailnet, and a different registry.
#
# WHY IT EXISTS AT ALL. nightly.sh used to create its builder with a
# bare `docker buildx create --driver docker-container --bootstrap` —
# no config, so no registry mirror. Every base image was resolved
# anonymously from Docker Hub over CodeBuild's shared egress IP, which
# is rate limited to 100 pulls per 6 hours across every tenant sharing
# it. On 2026-11-12 the gfx1151 run died two seconds in:
#
#   #7 [pytorch-src internal] load metadata for docker.io/library/ubuntu:26.04
#   #7 ERROR: unexpected status from HEAD request to
#      https://registry-1.docker.io/v2/library/ubuntu/manifests/26.04: 429
#
# A warm run usually survives because the layer cache answers these,
# which is why it took a cold architecture to expose it.

# Mirror Docker Hub through Google's cache. Buildkit tries each mirror
# in order and falls back to the upstream, so a miss here costs one
# extra round trip and never a failure.
#
# This covers `ubuntu:26.04` and `docker/dockerfile:1` — both verified
# serving from mirror.gcr.io on 2026-11-12. It does NOT reliably cover
# `rocm/dev-ubuntu-26.04`: mirror.gcr.io caches frequently-accessed
# images and proxies the rest, and that one proxied straight through to
# a 429 when tested. The ROCm SDK needs the ECR pull-through rule
# instead — see DOCKERHUB in rocm-bake.hcl and --dockerhub-secret-arn
# in codebuild-setup.sh. The two are complementary and neither is
# sufficient alone.
#
# mirror.gcr.io is not the retired gcr.io Container Registry. That shut
# down in March 2025; the mirror moved to Artifact Registry and is
# still documented and serving.
[registry."docker.io"]
  mirrors = ["mirror.gcr.io"]

[worker.oci]
  enabled = true
  platforms = ["linux/amd64"]
  # Concurrent build STEPS, not cores — a single RUN uses as many
  # threads as the command inside it wants. 72 vCPU here, and the
  # measured shape is one short wide burst against a long tail, so
  # this is deliberately generous: starving the graph costs more than
  # oversubscribing it on a machine that averages 6% CPU.
  max-parallelism = 16
  gc = true
  # The machine is ephemeral and reports 1.3 TB free, so the only job
  # of GC here is to stop a single pathological run filling the disk
  # mid-build. Set well above the ~106 GB a full build's store
  # measures on the fleet.
  gckeepstorage = "400GB"

[worker.containerd]
  enabled = false
