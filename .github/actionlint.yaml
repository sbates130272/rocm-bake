---
# actionlint rejects any `runs-on:` label it does not recognise, which
# is the right default — a typo in a label is otherwise a job that
# queues until the workflow times out rather than an error. Custom
# labels have to be declared here to be accepted.
#
# These are the labels .builders/fleet.py's runner_labels() gives a
# node declaring the `runner` capability. check-contracts.py asserts
# this list stays in step with it, so the declaration cannot become
# the thing that hides the typo it exists to catch.
self-hosted-runner:
  labels:
    - rocm-bake
    - snoc
    - build
    - gpu
    - gfx1151
