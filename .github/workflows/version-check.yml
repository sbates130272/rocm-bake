name: Version check — upstream releases

# Weekly: compare every pin in rocm-bake.hcl against what upstream has
# released, and open or update one tracking issue when something is
# behind.
#
# This used to carry its own PyTorch and ROCm lookups in two
# github-script steps plus a grep|grep|sed parse of rocm-bake.hcl. That
# covered two of the thirteen pins, and it compared the two it did
# cover wrongly: it reduced the ROCm tag to "10.1" and tested it
# against the bake default "10.1.0-full", so `rocm_updated` was
# permanently true and a fresh issue was filed every Monday whether or
# not anything had moved. The old title also read backwards —
# "PyTorch <latest> -> <current>".
#
# All of that now lives in .builders/versioncheck.py, which the fleet
# runs interactively as `make version-check`. One implementation, so
# the weekly report and the one an operator runs cannot disagree.
on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare pins against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # --no-zot because the registry is a tailnet name this runner
        # cannot resolve. Skipping the column is not the same as
        # leaving it empty: an empty published column reads as "we have
        # published nothing", which is not what it would mean here.
        #
        # The script reports a failed lookup as "?" rather than exiting
        # non-zero, deliberately — the ROCm org's token policy and
        # Docker Hub's rate limit are both outside our control, and a
        # weekly job that goes red on either gets switched off. A
        # persistent "?" is surfaced in the issue body instead.
        run: |
          python3 .builders/versioncheck.py --markdown --no-zot \
            | tee /tmp/versions.md
          behind=$(grep -c '| behind |' /tmp/versions.md || true)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "::notice::$behind pin(s) behind upstream"

      - name: File or update the tracking issue
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue, commented on, rather than a new issue a week. A
        # pin that stays behind for a month is one conversation, not
        # four duplicates.
        run: |
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The weekly check found pin(s) behind upstream." \
            "$(cat /tmp/versions.md)" \
            "Bump the variable in \`rocm-bake.hcl\`, then run \`make version-scrub\` to regenerate the tables in README.md and the docs.")
          existing=$(gh issue list --label version-update --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::commented on issue #$existing"
          else
            gh issue create \
              --title "[update] pins behind upstream" \
              --label version-update --label automated \
              --body "$body"
          fi
