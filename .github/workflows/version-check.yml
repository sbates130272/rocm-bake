name: Version check — ROCm / PyTorch releases

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PyTorch latest release
        id: pytorch
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'pytorch',
              repo: 'pytorch',
              per_page: 5,
            });
            const latestStable = releases.find(r => !r.prerelease && r.tag_name.startsWith('v2.'));
            if (latestStable) {
              core.setOutput('version', latestStable.tag_name.replace('v', ''));
              core.setOutput('url', latestStable.html_url);
            } else {
              core.setOutput('version', 'unknown');
            }

      - name: Check ROCm latest release
        id: rocm
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'ROCm',
              repo: 'ROCm',
              per_page: 10,
            });
            const stable = releases.filter(r =>
              /rocm-\d+\.\d+/.test(r.tag_name) &&
              !r.tag_name.includes('-rc') &&
              !r.tag_name.includes('-dev')
            );
            if (stable.length > 0) {
              const match = stable[0].tag_name.match(/rocm-(\d+\.\d+)/);
              if (match) core.setOutput('version', match[1]);
              core.setOutput('tag', stable[0].tag_name);
            } else {
              core.setOutput('version', 'unknown');
            }

      - name: Read current versions from rocm-bake.hcl
        id: current
        run: |
          PYTORCH=$(grep 'default = "' rocm-bake.hcl | grep PYTORCH_VERSION -m1 | sed 's/.*default = "\([^"]*\)".*/\1/')
          ROCM=$(grep 'default = "' rocm-bake.hcl | grep ROCM_VERSION -m1 | sed 's/.*default = "\([^"]*\)".*/\1/')
          echo "pytorch=$PYTORCH" >> "$GITHUB_OUTPUT"
          echo "rocm=$ROCM" >> "$GITHUB_OUTPUT"

      - name: Report results
        id: report
        run: |
          echo "Current bake defaults: PyTorch ${{ steps.current.outputs.pytorch }}, ROCm ${{ steps.current.outputs.rocm }}"
          echo "Latest PyTorch: ${{ steps.pytorch.outputs.version }} (${{ steps.pytorch.outputs.url }})"
          echo "Latest ROCm: ${{ steps.rocm.outputs.tag }}"

          PYTORCH_UPDATED=false
          ROCM_UPDATED=false
          [[ "${{ steps.pytorch.outputs.version }}" != "${{ steps.current.outputs.pytorch }}" && "${{ steps.pytorch.outputs.version }}" != "unknown" ]] && PYTORCH_UPDATED=true
          [[ "${{ steps.rocm.outputs.version }}" != "${{ steps.current.outputs.rocm }}" && "${{ steps.rocm.outputs.version }}" != "unknown" ]] && ROCM_UPDATED=true

          echo "pytorch_updated=$PYTORCH_UPDATED" >> "$GITHUB_OUTPUT"
          echo "rocm_updated=$ROCM_UPDATED" >> "$GITHUB_OUTPUT"

          if $PYTORCH_UPDATED || $ROCM_UPDATED; then
            echo "::notice::New version(s) available. See report output above."
          else
            echo "::notice::All up to date."
          fi

      - name: Create issue on new version
        if: steps.report.outputs.pytorch_updated == 'true' || steps.report.outputs.rocm_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pytorchUpdated = '${{ steps.report.outputs.pytorch_updated }}' === 'true';
            const rocmUpdated = '${{ steps.report.outputs.rocm_updated }}' === 'true';

            let title = '[update] PyTorch ROCm version(s) available';
            if (pytorchUpdated) title += `, PyTorch ${{ steps.pytorch.outputs.version }} -> ${{ steps.current.outputs.pytorch }}`;
            if (rocmUpdated) title += `, ROCm ${{ steps.rocm.outputs.tag }}`;

            const lines = [
              'Weekly check found newer release(s):',
              '',
              '| Source | Current | Latest | URL |',
              '|--------|---------|--------|-----|',
              `| PyTorch | ${{ steps.current.outputs.pytorch }} | ${{ steps.pytorch.outputs.version }} | ${{ steps.pytorch.outputs.url }} |`,
              `| ROCm | ${{ steps.current.outputs.rocm }} | ${{ steps.rocm.outputs.tag }} | [GitHub](https://github.com/ROCm/ROCm/releases) |`,
              '',
              'Update `rocm-bake.hcl` variables `PYTORCH_VERSION` and/or `ROCM_VERSION` to pull the new default.'
            ];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: lines.join('\n'),
              labels: ['version-update', 'automated'],
            });
