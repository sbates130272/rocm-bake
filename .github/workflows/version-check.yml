name: Version check — upstream releases

# Weekly: compare every pin in rocm-bake.hcl against what upstream has
# released, and open or update one tracking issue when something is
# behind.
#
# This used to carry its own PyTorch and ROCm lookups in two
# github-script steps plus a grep|grep|sed parse of rocm-bake.hcl. That
# covered two of the thirteen pins, and it compared the two it did
# cover wrongly: it reduced the ROCm tag to "10.1" and tested it
# against the bake default "10.1.0-full", so `rocm_updated` was
# permanently true and a fresh issue was filed every Monday whether or
# not anything had moved. The old title also read backwards —
# "PyTorch <latest> -> <current>".
#
# All of that now lives in .builders/versioncheck.py, which the fleet
# runs interactively as `make version-check`. One implementation, so
# the weekly report and the one an operator runs cannot disagree.
#
# THE SECOND HALF: A PULL REQUEST. The issue said "bump the variable,
# then run make version-scrub", which is a mechanical edit described
# to a person. `versioncheck.py --bump` makes it, and this opens a
# pull request with the result. What stays with a person is the part
# that was never mechanical: reading CI, deciding whether a new vLLM
# needs a Dockerfile to change with it, and merging. Sunday's weekly
# build in nightly.yml then builds and publishes whatever was merged.
#
# Some pins are reported and deliberately not moved -- a new ROCm
# above all. BUMP_HOLD in versioncheck.py lists them with reasons, and
# the pull request body repeats them.
on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  # write, for the bump branch. Nothing here builds or runs the pins
  # it moves: the job reads release metadata and edits two text files.
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: Compare pins against upstream
    runs-on: ubuntu-latest
    steps:
      # BUMP_PR_TOKEN, when it is set, is what the bump branch is
      # pushed with. It matters because of a GitHub rule: nothing done
      # with the workflow's own token starts another workflow, so a
      # pull request opened that way gets no CI at all. A fine-grained
      # token with contents and pull-requests write on this repository
      # is enough. Without it the pull request is still opened, and
      # its body says how to start CI by hand.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMP_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # --no-zot because the registry is a tailnet name this runner
        # cannot resolve. Skipping the column is not the same as
        # leaving it empty: an empty published column reads as "we have
        # published nothing", which is not what it would mean here.
        #
        # The script reports a failed lookup as "?" rather than exiting
        # non-zero, deliberately — the ROCm org's token policy and
        # Docker Hub's rate limit are both outside our control, and a
        # weekly job that goes red on either gets switched off. A
        # persistent "?" is surfaced in the issue body instead.
        run: |
          python3 .builders/versioncheck.py --markdown --no-zot \
            | tee /tmp/versions.md
          behind=$(grep -c '| behind |' /tmp/versions.md || true)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "::notice::$behind pin(s) behind upstream"

      - name: File or update the tracking issue
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue, commented on, rather than a new issue a week. A
        # pin that stays behind for a month is one conversation, not
        # four duplicates.
        run: |
          # `gh issue create --label X` fails outright when X does not
          # exist, and neither label did — so the first time any pin
          # went behind, this step died instead of filing the issue it
          # exists to file. That is the worst possible moment for it:
          # the job is green every week it has nothing to say, and red
          # exactly when it has something.
          #
          # Observed on the 2026-11-02 scheduled run, which failed here
          # with VLLM_REF behind v0.33.0. Creating them lazily, inside
          # the `behind != 0` branch, keeps a repo that never falls
          # behind free of labels it never uses. --force makes it a
          # no-op once they exist.
          gh label create version-update --force \
            --color 0e8a16 --description "A pinned dependency is behind upstream"
          gh label create automated --force \
            --color ededed --description "Filed by a workflow, not a human"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The weekly check found pin(s) behind upstream." \
            "$(cat /tmp/versions.md)" \
            "Bump the variable in \`rocm-bake.hcl\`, then run \`make version-scrub\` to regenerate the tables in README.md and the docs.")
          existing=$(gh issue list --label version-update --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::commented on issue #$existing"
          else
            gh issue create \
              --title "[update] pins behind upstream" \
              --label version-update --label automated \
              --body "$body"
          fi

      # After the issue, so a failure here cannot cost the report.
      - name: Move the pins that are behind
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .builders/versioncheck.py --bump | tee /tmp/bump.md
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing to bump"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open or update the bump pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN || github.token }}
          HAVE_PAT: ${{ secrets.BUMP_PR_TOKEN != '' }}
          BRANCH: chore/version-bump
        # One branch and one pull request, rebuilt each week from main,
        # for the reason the issue is one issue: a pin that stays
        # behind for a month is one conversation.
        run: |
          set -euo pipefail
          bot='github-actions[bot]'

          # Rebuilding means a force-push, and that is only safe while
          # the branch holds nothing but this job's own commit. The
          # usual next step after a bump is a person pushing the
          # Dockerfile fix the new version needs; overwriting that a
          # week later would be this job destroying the work it asked
          # for. So a branch anyone else has committed to is left
          # alone, and the pull request gets a comment instead.
          if git fetch -q origin "+${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            others=$(git log --format=%an "origin/main..origin/${BRANCH}" \
                       | grep -vxF "$bot" | sort -u | paste -sd, -)
          else
            others=""
          fi
          open=$(gh pr list --head "$BRANCH" --state open \
                   --json number --jq '.[0].number // empty')

          if [ -n "$others" ] && [ -n "$open" ]; then
            {
              printf 'This week against `main`, the check would move:\n\n'
              cat /tmp/bump.md
              printf '\n\nThe branch has commits by %s, so it was left as it is.\n' "$others"
            } > /tmp/comment.md
            gh pr comment "$open" --body-file /tmp/comment.md
            echo "::notice::#$open has commits by $others; commented, branch untouched"
            exit 0
          fi

          {
            printf 'The weekly version check moved these pins in `rocm-bake.hcl` '
            printf 'and regenerated the version tables.\n\n'
            cat /tmp/bump.md
            printf '\n\nThis is the edit and nothing more. Nothing has been built '
            printf 'with these versions: a new upstream release often needs a '
            printf 'Dockerfile to change with it, and that is what the review '
            printf 'is for. Push fixes to this branch; once it has a commit '
            printf 'that is not the bot'"'"'s, later runs comment here and stop '
            printf 'rebuilding it.\n\n'
            printf 'Once merged, the Sunday build in `nightly.yml` builds every '
            printf 'architecture and publishes the wheels.\n'
            if [ "$HAVE_PAT" != "true" ]; then
              printf '\n> **CI has not run on this pull request.** It was '
              printf 'opened with the workflow token, and GitHub starts no '
              printf 'workflow for those. Close and reopen it to run CI, or '
              printf 'set the `BUMP_PR_TOKEN` secret so the next one starts '
              printf 'it itself.\n'
            fi
          } > /tmp/pr.md

          # The issue step creates these only when a pin is behind, and
          # a derived pin can move on a week when none is.
          gh label create version-update --force \
            --color 0e8a16 --description "A pinned dependency is behind upstream"
          gh label create automated --force \
            --color ededed --description "Filed by a workflow, not a human"

          git checkout -q -B "$BRANCH"
          git -c user.name="$bot" \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -s -a -m "chore(deps): move pins to current upstream" \
                     -m "$(cat /tmp/bump.md)"
          git push -q --force origin "$BRANCH"

          if [ -n "$open" ]; then
            gh pr edit "$open" --body-file /tmp/pr.md
            echo "::notice::updated #$open"
          elif ! gh pr create --base main --head "$BRANCH" \
                   --title "chore(deps): move pins to current upstream" \
                   --label version-update --label automated \
                   --body-file /tmp/pr.md; then
            # The branch is pushed either way, so nothing is lost.
            echo "::error::could not open the pull request. With the" \
                 "workflow token this needs Settings -> Actions ->" \
                 "General -> 'Allow GitHub Actions to create and approve" \
                 "pull requests'. The branch $BRANCH has been pushed."
            exit 1
          fi
