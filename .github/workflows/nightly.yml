---
name: Nightly — cold and warm build

# A cold build and a warm build of every target, per architecture, on
# AWS CodeBuild, published to ECR and reported as a GitHub issue.
#
# Why CodeBuild rather than a fleet of self-hosted runners: it is an
# EC2 instance AWS administers, rented by the minute, with privileged
# mode for BuildKit, up to 72 vCPU and 824 GB of SSD, and build
# timeouts in hours. The ephemeral-runner alternative needs a Lambda
# webhook handler, a launch template, a builder AMI kept in step with
# ansible/roles/, and a sweep for orphaned instances. See
# docs/operations/runners.md.
#
# NOT CodeBuild's Lambda compute mode, which AWS documents as
# supporting no Docker builds or runs, no privileged mode, no caching
# and nothing over 15 minutes.
#
# The matrix axis is ARCHITECTURE, not target. balance.sh resolves the
# targets into nine waves whose maxima sum to within ~3% of the total
# work in .builders/target-costs — the graph is a near-serial chain, so
# splitting targets across machines buys almost nothing and turns local
# layer reuse into registry pulls. Architectures share no edges.
#
# TWO SCHEDULES, ONE WORKFLOW. Monday to Saturday is the nightly: one
# architecture (NIGHTLY_ARCHES), skipped when main has not moved,
# nothing published. It exists to say that main still builds. Sunday
# is the weekly: every architecture, whether or not main moved, and
# the wheels are published when all of them build.
#
# The weekly ignores the "has main moved" gate on purpose. A build has
# inputs that no commit of ours records -- the base image behind a
# tag, the Ubuntu archive -- and a week is long enough for them to
# shift. With a warm cache an unchanged architecture costs minutes,
# and a build whose wheels come out identical publishes nothing.
#
# One workflow rather than two because the build job is the same job:
# same machine, same caches, same forty lines of environment that
# record why each value is what it is. A copy would drift. Sharing the
# concurrency group also keeps a weekly and a nightly from running at
# once against the same registry cache.
on:
  schedule:
    # 02:17 UTC. Not 02:00: every scheduled workflow on GitHub is
    # written for the top of an hour, and the queue there is long
    # enough to delay a job by many minutes.
    - cron: '17 2 * * 1-6'
    # The weekly. Sunday, so the published indexes are a day old when
    # wheels-probe.yml resolves them on Monday morning, and so a pin
    # bump merged during the week is what gets built. The `changed`
    # job compares github.event.schedule against this exact string;
    # change both together.
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      arches:
        description: 'Space-separated arch list (default: ARCHES in the Makefile)'
        required: false
        default: ''
      # Opt IN to cold, rather than opting out. A scheduled run sends no
      # inputs at all, so a `skip_cold` defaulting to false meant every
      # night paid for both halves — and the cold half pushes nothing
      # and deletes its own sccache prefix, so it is bought purely as a
      # measurement. Warm is what the nightly is for; cold is a thing
      # you ask for.
      run_cold:
        description: 'Also run the cold build (roughly doubles cost)'
        type: boolean
        required: false
        default: false
      # Consumed as `github.event_name == 'workflow_dispatch' && !inputs.push`,
      # NOT as `inputs.push == false`. A scheduled run sends no inputs,
      # and `default:` is only materialised for workflow_dispatch, so on
      # a schedule `inputs.push` is null — and GitHub's comparison coerces
      # both null and false to 0, making `null == false` TRUE. Every
      # scheduled night from 2026-11-04 to 2026-11-10 therefore ran with
      # --no-push: cache was exported, no artifact image was ever
      # published, and ECR's newest wheel stayed stuck on 2026-11-03
      # while the reports said SUCCEEDED. The event_name guard is what
      # keeps a null from reading as an opt-out.
      push:
        description: 'Push the warm build to ECR'
        type: boolean
        required: false
        default: true
      targets:
        description: 'Space-separated bake targets (default: the whole default group)'
        required: false
        default: ''
      # Run Sunday's shape now: every architecture, then publish. The
      # publish is skipped if `push` is off or `targets` is set, since
      # either means ECR does not hold a complete set from this run.
      weekly:
        description: 'Weekly run: all architectures, then publish the wheels'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # One nightly at a time. Two runs would share the registry cache and
  # each would report the other's contention as its own cost.
  group: nightly
  cancel-in-progress: false

jobs:
  # Rebuilding an unchanged tree costs an hour of 72 vCPU and tells
  # you what last night already did. So a scheduled run stops here
  # unless main has moved since the last nightly that succeeded.
  #
  # Against the last SUCCESSFUL run, deliberately: comparing against
  # the last run of any kind would mean a night that failed is never
  # retried, and a transient failure would freeze the nightly until
  # someone pushed something.
  #
  # workflow_dispatch always proceeds — asking for a run by hand is
  # the statement that you want one.
  changed:
    name: Has main moved?
    runs-on: ubuntu-latest
    if: vars.NIGHTLY_ENABLED == 'true'
    outputs:
      run: ${{ steps.check.outputs.run }}
      weekly: ${{ steps.check.outputs.weekly }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Decided here, once, and read by every later job as
          # needs.changed.outputs.weekly. `inputs.weekly` is null on a
          # schedule and `github.event.schedule` is null on a
          # dispatch, so each half is false exactly when the other
          # applies.
          WEEKLY: ${{ github.event.schedule == '17 2 * * 0' || inputs.weekly == true }}
        run: |
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          if [ "$WEEKLY" = "true" ]; then
            echo "weekly run — every architecture, regardless of main"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dispatched by hand — running regardless"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled runs only. A workflow_dispatch is an experiment —
          # often one cheap target with --no-push — and letting one
          # count as "this commit has been built" would suppress the
          # real nightly at that SHA.
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?event=schedule" \
                   --jq '[.workflow_runs[]
                         | select(.conclusion == "success")][0].head_sha // empty' \
                 2>/dev/null || true)
          echo "last successful scheduled nightly: ${last:-none}"
          echo "current HEAD:            ${{ github.sha }}"
          if [ -z "$last" ]; then
            echo "no successful nightly on record — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "${{ github.sha }}" ]; then
            echo "::notice::main is unchanged since the last successful nightly; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Resolved once, so the matrix and the report agree and a dispatch
  # override is visible in the log rather than implied.
  arches:
    name: Which architectures
    needs: changed
    runs-on: ubuntu-latest
    if: needs.changed.outputs.run == 'true'
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # Three sources, most specific first: the dispatch input, then a
      # NIGHTLY_ARCHES repository variable, then the Makefile's ARCHES.
      #
      # The variable is the one that matters in practice. A nightly
      # worth trusting starts on one architecture and widens once the
      # image and the IAM role have been proven, and that decision
      # should not require a commit — nor should it be re-made by hand
      # on every dispatch, which is how a "temporary" single-arch
      # nightly silently becomes a three-arch bill.
      #
      # The weekly reads WEEKLY_ARCHES instead and never
      # NIGHTLY_ARCHES: that variable is what keeps the nightly to one
      # architecture, which is the opposite of what the weekly is for.
      # Unset, it is every architecture the Makefile lists.
      - id: pick
        env:
          NIGHTLY_ARCHES: ${{ vars.NIGHTLY_ARCHES }}
          WEEKLY_ARCHES: ${{ vars.WEEKLY_ARCHES }}
          WEEKLY: ${{ needs.changed.outputs.weekly }}
        run: |
          arches="${{ inputs.arches }}"
          source="workflow_dispatch input"
          if [ -z "$arches" ] && [ "$WEEKLY" = "true" ]; then
            arches="$WEEKLY_ARCHES"
            source="WEEKLY_ARCHES repository variable"
          elif [ -z "$arches" ]; then
            arches="$NIGHTLY_ARCHES"
            source="NIGHTLY_ARCHES repository variable"
          fi
          if [ -z "$arches" ]; then
            arches=$(make -s arches-list | sed -n 's/^ARCHES = //p')
            source="ARCHES in the Makefile"
          fi
          echo "resolved: $arches  (from $source)"
          printf 'list=%s\n' \
            "$(printf '%s' "$arches" | jq -Rc 'split(" ") | map(select(length>0))')" \
            >> "$GITHUB_OUTPUT"

  # One job per architecture, each waiting on the one before it. The
  # chain, rather than a matrix, is what keeps CodeBuild from being
  # asked for two runners at once; .github/workflows/nightly-build.yml
  # carries the measurement that forced it.
  #
  # `if` on membership of the resolved list, so an architecture this
  # run did not ask for is skipped rather than built. `always()` on
  # every link but the first, so one architecture failing does not
  # cancel the rest — what `fail-fast: false` did for the matrix.
  #
  # Adding an architecture means adding a link here and naming it in
  # `needs` for `report` and `publish`; check-contracts.py fails if
  # this chain and the Makefile's ARCHES disagree.
  gfx950:
    needs: arches
    if: >-
      contains(fromJson(needs.arches.outputs.list), 'gfx950')
    uses: ./.github/workflows/nightly-build.yml
    with:
      arch: gfx950
      targets: ${{ inputs.targets || '' }}
      run_cold: ${{ inputs.run_cold || vars.NIGHTLY_COLD == 'true' }}
      push: ${{ !(github.event_name == 'workflow_dispatch' && !inputs.push) }}

  gfx1201:
    needs: [arches, gfx950]
    if: >-
      always() && needs.arches.result == 'success'
      && contains(fromJson(needs.arches.outputs.list), 'gfx1201')
    uses: ./.github/workflows/nightly-build.yml
    with:
      arch: gfx1201
      targets: ${{ inputs.targets || '' }}
      run_cold: ${{ inputs.run_cold || vars.NIGHTLY_COLD == 'true' }}
      push: ${{ !(github.event_name == 'workflow_dispatch' && !inputs.push) }}

  gfx1151:
    needs: [arches, gfx1201]
    if: >-
      always() && needs.arches.result == 'success'
      && contains(fromJson(needs.arches.outputs.list), 'gfx1151')
    uses: ./.github/workflows/nightly-build.yml
    with:
      arch: gfx1151
      targets: ${{ inputs.targets || '' }}
      run_cold: ${{ inputs.run_cold || vars.NIGHTLY_COLD == 'true' }}
      push: ${{ !(github.event_name == 'workflow_dispatch' && !inputs.push) }}

  gfx1250:
    needs: [arches, gfx1151]
    if: >-
      always() && needs.arches.result == 'success'
      && contains(fromJson(needs.arches.outputs.list), 'gfx1250')
    uses: ./.github/workflows/nightly-build.yml
    with:
      arch: gfx1250
      targets: ${{ inputs.targets || '' }}
      run_cold: ${{ inputs.run_cold || vars.NIGHTLY_COLD == 'true' }}
      push: ${{ !(github.event_name == 'workflow_dispatch' && !inputs.push) }}

  report:
    name: Report
    needs: [changed, arches, gfx950, gfx1201, gfx1151, gfx1250]
    # always(): a nightly that reports only on success cannot be told
    # apart from one that never ran. The issue is the signal, so it
    # has to survive the failure it exists to describe.
    if: always() && needs.arches.result == 'success'
    runs-on: ubuntu-latest
    # contents: write so this job can publish onto gh-pages. It is the
    # build job that must not hold it — that one runs repository code
    # on a machine with registry credentials. This one only reads
    # artifacts and writes a page, on a GitHub-hosted runner.
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/reports
          pattern: nightly-*

      - name: Assemble the night's summary
        env:
          # One word per architecture, in chain order. Reduced in shell
          # below rather than in an `if:` expression, so the summary can
          # say which state it found.
          ARCH_RESULTS: >-
            ${{ needs.gfx950.result }}
            ${{ needs.gfx1201.result }}
            ${{ needs.gfx1151.result }}
            ${{ needs.gfx1250.result }}
        run: |
          result=success
          for r in ${ARCH_RESULTS}; do
            case "${r}" in success | skipped) ;; *) result="${r}" ;; esac
          done
          {
            printf '## %s %s\n\n' \
              "${{ needs.changed.outputs.weekly == 'true' && 'Weekly' || 'Nightly' }}" \
              "$(date -u +%Y-%m-%d)"
            printf 'Build result: **%s**\n\n' "${result}"
            found=0
            for d in /tmp/reports/nightly-*/; do
              [ -s "$d/report.md" ] || continue
              found=1
              printf '### %s\n\n' "$(basename "$d" | sed 's/^nightly-//')"
              cat "$d/report.md"
              printf '\n'
            done
            if [ "$found" = 0 ]; then
              printf '_No report was produced — the build did not get far enough._\n'
            fi
            printf '\n[Run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > /tmp/summary.md
          cat /tmp/summary.md

      # Same shape as version-check.yml: one issue, commented on,
      # rather than a fresh issue nightly. Labels are created with
      # --force first because `gh issue create --label X` fails
      # outright when X does not exist — which would break this step
      # on the first night it had anything to say.
      # A separate area from data/perf/, deliberately. Those runs come
      # from perfrun.sh across the fleet, with per-target timings and
      # sampling; these are two bake invocations on one rented
      # machine. docs/performance/ opens with a warning about quoting
      # one harness's numbers as another's, and merging them into one
      # index would be that mistake made structural.
      - name: Publish the run onto gh-pages
        if: contains(needs.*.result, 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/ghp origin/gh-pages --detach
          dest="/tmp/ghp/data/nightly/${stamp}"
          mkdir -p "$dest"
          for d in /tmp/reports/nightly-*/; do
            [ -d "$d" ] || continue
            arch=$(basename "$d" | sed 's/^nightly-//')
            mkdir -p "$dest/$arch"
            cp "$d"/report.md "$d"/summary.json "$dest/$arch/" 2>/dev/null || true
          done
          cp /tmp/summary.md "$dest/index.md"
          python3 -I .builders/nightlysite.py /tmp/ghp/data/nightly
          cd /tmp/ghp
          git add data/nightly
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "data: add nightly run ${stamp}"
            # HEAD:gh-pages, not the branch name: this worktree is
            # detached, and pushing the branch name would push the
            # local ref rather than what was just committed.
            git push origin HEAD:gh-pages
          fi

      - name: File or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nightly --force \
            --color 1d76db --description "Scheduled cold/warm build report"
          gh label create automated --force \
            --color ededed --description "Filed by a workflow, not a human"
          body=$(cat /tmp/summary.md)
          existing=$(gh issue list --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::commented on issue #$existing"
          else
            gh issue create \
              --title "[nightly] cold and warm build report" \
              --label nightly --label automated \
              --body "$body"
          fi

  # The weekly's second half: put what was just built where people
  # install it from.
  #
  # All or nothing across architectures: one failing holds back the
  # others, because a set of indexes that are not all on the same pins
  # is harder to reason about than a week-old set that is. `skipped`
  # counts as fine — it is an architecture this run was not asked for,
  # and it is not in the matrix below either.
  #
  # After `report`, not beside it: both push to gh-pages, and the
  # loser of that race fails on a non-fast-forward. `always()` because
  # a report that failed is no reason to withhold wheels that built.
  #
  # One architecture at a time, for the same branch. Each leg is the
  # whole of wheels-publish.yml, which is where the reasons for its
  # machine size and its permissions are written down.
  publish:
    name: Publish
    needs: [changed, arches, gfx950, gfx1201, gfx1151, gfx1250, report]
    if: >-
      always()
      && needs.changed.outputs.weekly == 'true'
      && contains(fromJson('["success", "skipped"]'), needs.gfx950.result)
      && contains(fromJson('["success", "skipped"]'), needs.gfx1201.result)
      && contains(fromJson('["success", "skipped"]'), needs.gfx1151.result)
      && contains(fromJson('["success", "skipped"]'), needs.gfx1250.result)
      && !(github.event_name == 'workflow_dispatch'
           && (!inputs.push || inputs.targets != ''))
    strategy:
      fail-fast: false
      # A matrix here, where the builds above are a chain, and the
      # difference is the quota. These run on `instance-size:small`,
      # which the account allows thirty of at once, so four webhooks in
      # one second are four builds that all start and none that queue.
      #
      # max-parallel is still 1, for gh-pages: each leg commits the
      # index there, and four concurrent pushes would mostly collide.
      # It does not hold the webhooks back — nothing does but `needs` —
      # so three runners idle while the first publishes, at $0.005 a
      # minute. Call it five cents a weekly.
      max-parallel: 1
      matrix:
        arch: ${{ fromJson(needs.arches.outputs.list) }}
    permissions:
      contents: write
    uses: ./.github/workflows/wheels-publish.yml
    with:
      arch: ${{ matrix.arch }}
      dry_run: false
