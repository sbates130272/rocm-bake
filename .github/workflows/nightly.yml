---
name: Nightly — cold and warm build

# A cold build and a warm build of every target, per architecture, on
# AWS CodeBuild, published to ECR and reported as a GitHub issue.
#
# Why CodeBuild rather than a fleet of self-hosted runners: it is an
# EC2 instance AWS administers, rented by the minute, with privileged
# mode for BuildKit, up to 72 vCPU and 824 GB of SSD, and build
# timeouts in hours. The ephemeral-runner alternative needs a Lambda
# webhook handler, a launch template, a builder AMI kept in step with
# ansible/roles/, and a sweep for orphaned instances. See
# docs/operations/runners.md.
#
# NOT CodeBuild's Lambda compute mode, which AWS documents as
# supporting no Docker builds or runs, no privileged mode, no caching
# and nothing over 15 minutes.
#
# The matrix axis is ARCHITECTURE, not target. balance.sh resolves the
# targets into nine waves whose maxima sum to within ~3% of the total
# work in .builders/target-costs — the graph is a near-serial chain, so
# splitting targets across machines buys almost nothing and turns local
# layer reuse into registry pulls. Architectures share no edges.
on:
  schedule:
    # 02:17 UTC. Not 02:00: every scheduled workflow on GitHub is
    # written for the top of an hour, and the queue there is long
    # enough to delay a job by many minutes.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      arches:
        description: 'Space-separated arch list (default: ARCHES in the Makefile)'
        required: false
        default: ''
      # Opt IN to cold, rather than opting out. A scheduled run sends no
      # inputs at all, so a `skip_cold` defaulting to false meant every
      # night paid for both halves — and the cold half pushes nothing
      # and deletes its own sccache prefix, so it is bought purely as a
      # measurement. Warm is what the nightly is for; cold is a thing
      # you ask for.
      run_cold:
        description: 'Also run the cold build (roughly doubles cost)'
        type: boolean
        required: false
        default: false
      # Consumed as `github.event_name == 'workflow_dispatch' && !inputs.push`,
      # NOT as `inputs.push == false`. A scheduled run sends no inputs,
      # and `default:` is only materialised for workflow_dispatch, so on
      # a schedule `inputs.push` is null — and GitHub's comparison coerces
      # both null and false to 0, making `null == false` TRUE. Every
      # scheduled night from 2026-11-04 to 2026-11-10 therefore ran with
      # --no-push: cache was exported, no artifact image was ever
      # published, and ECR's newest wheel stayed stuck on 2026-11-03
      # while the reports said SUCCEEDED. The event_name guard is what
      # keeps a null from reading as an opt-out.
      push:
        description: 'Push the warm build to ECR'
        type: boolean
        required: false
        default: true
      targets:
        description: 'Space-separated bake targets (default: the whole default group)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One nightly at a time. Two runs would share the registry cache and
  # each would report the other's contention as its own cost.
  group: nightly
  cancel-in-progress: false

jobs:
  # Rebuilding an unchanged tree costs an hour of 72 vCPU and tells
  # you what last night already did. So a scheduled run stops here
  # unless main has moved since the last nightly that succeeded.
  #
  # Against the last SUCCESSFUL run, deliberately: comparing against
  # the last run of any kind would mean a night that failed is never
  # retried, and a transient failure would freeze the nightly until
  # someone pushed something.
  #
  # workflow_dispatch always proceeds — asking for a run by hand is
  # the statement that you want one.
  changed:
    name: Has main moved?
    runs-on: ubuntu-latest
    if: vars.NIGHTLY_ENABLED == 'true'
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dispatched by hand — running regardless"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled runs only. A workflow_dispatch is an experiment —
          # often one cheap target with --no-push — and letting one
          # count as "this commit has been built" would suppress the
          # real nightly at that SHA.
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?event=schedule" \
                   --jq '[.workflow_runs[]
                         | select(.conclusion == "success")][0].head_sha // empty' \
                 2>/dev/null || true)
          echo "last successful scheduled nightly: ${last:-none}"
          echo "current HEAD:            ${{ github.sha }}"
          if [ -z "$last" ]; then
            echo "no successful nightly on record — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "${{ github.sha }}" ]; then
            echo "::notice::main is unchanged since the last successful nightly; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved — running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Resolved once, so the matrix and the report agree and a dispatch
  # override is visible in the log rather than implied.
  arches:
    name: Which architectures
    needs: changed
    runs-on: ubuntu-latest
    if: needs.changed.outputs.run == 'true'
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # Three sources, most specific first: the dispatch input, then a
      # NIGHTLY_ARCHES repository variable, then the Makefile's ARCHES.
      #
      # The variable is the one that matters in practice. A nightly
      # worth trusting starts on one architecture and widens once the
      # image and the IAM role have been proven, and that decision
      # should not require a commit — nor should it be re-made by hand
      # on every dispatch, which is how a "temporary" single-arch
      # nightly silently becomes a three-arch bill.
      - id: pick
        env:
          NIGHTLY_ARCHES: ${{ vars.NIGHTLY_ARCHES }}
        run: |
          arches="${{ inputs.arches }}"
          source="workflow_dispatch input"
          if [ -z "$arches" ]; then
            arches="$NIGHTLY_ARCHES"
            source="NIGHTLY_ARCHES repository variable"
          fi
          if [ -z "$arches" ]; then
            arches=$(make -s arches-list | sed -n 's/^ARCHES = //p')
            source="ARCHES in the Makefile"
          fi
          echo "resolved: $arches  (from $source)"
          printf 'list=%s\n' \
            "$(printf '%s' "$arches" | jq -Rc 'split(" ") | map(select(length>0))')" \
            >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }}
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.arches.outputs.list) }}

    # A CodeBuild-hosted ephemeral runner: CodeBuild takes the
    # WORKFLOW_JOB_QUEUED webhook, starts a build, registers a runner
    # for this one job and terminates it after. A runner showing
    # "Offline" in the GitHub UI is the expected steady state here.
    #
    # The trailing label overrides the project's instance size per
    # job, which is why one project serves the whole matrix.
    #
    # xlarge (36 vCPU / 72 GiB / 256 GB) rather than 2xlarge (72 / 144
    # / 824), at $0.0798 a build-minute against $0.200 — 2.5x cheaper.
    # Three measurements, each of which had to clear before this was
    # safe, all from CloudWatch per-build metrics and the footprint
    # block nightly.sh writes:
    #
    #   CPU   peaks at 66% of 72 vCPU for about one minute and spends
    #         most of the run under 10%; mean 6-16% across six runs.
    #         The five genuinely wide steps total ~8 minutes, so the
    #         worst case is wall clock growing by roughly that, against
    #         a minute that costs 40% as much.
    #   DISK  was the real gate: xlarge cuts 824 GB to 256 GB, a bigger
    #         cut than CPU or RAM, and nothing had ever measured it.
    #         The 2026-11-12 gfx1151 run — a COLD architecture, the
    #         most expensive shape there is — used 122.7 GiB with a
    #         113.7 GB BuildKit store. Roughly 2x headroom.
    #   RAM   looked like the blocker at 113-116 GB of "MemoryUtilized",
    #         which AWS never defines. The footprint block split it:
    #         anon 0.2 GiB against 1.5 GiB of page cache. It is
    #         reclaimable, so a 72 GiB box evicts rather than OOMs, and
    #         Dockerfile.pytorch derives MAX_JOBS from MemAvailable so
    #         the build self-throttles on a smaller machine anyway.
    #
    # Revert by changing this label and NIGHTLY_INSTANCE below; they
    # must agree or the cost line reports the wrong rate.
    runs-on:
      - codebuild-${{ vars.CODEBUILD_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:xlarge

    # Measured on snoc-think (32 cores), the targets total 9089 s of
    # work and the cold half runs them from nothing. Six hours is
    # generous on 36 vCPU and still bounds a wedged build — and it is
    # now also the worst-case bill: 360 min x $0.0798 = $28.73, where
    # on 2xlarge the same hang cost $72.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # The build's identity is the CodeBuild project's service role,
      # already attached to this machine. No OIDC exchange and no
      # stored keys — those are for GitHub-hosted jobs that need AWS.
      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin \
                "${{ vars.ECR_REGISTRY }}"

      - name: Cold and warm build for ${{ matrix.arch }}
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          # ECR is HTTPS with auth. The bake file defaults this true
          # for the fleet's plain-HTTP Zot, and leaving it that way
          # here fails every cache export rather than falling back.
          REGISTRY_INSECURE: "false"
          CACHE_TAG_SUFFIX: -nightly
          # Where `ubuntu` and `rocm/dev-ubuntu-26.04` come from. Unset
          # means Docker Hub directly, which is what the fleet does and
          # what this lane did until it hit Docker Hub's anonymous rate
          # limit on 2026-11-12 — a 429 two seconds into the gfx1151
          # run, because CodeBuild egresses from an IP shared with every
          # other tenant on it.
          #
          # Set NIGHTLY_DOCKERHUB to an ECR pull-through prefix, e.g.
          # <account>.dkr.ecr.<region>.amazonaws.com/dockerhub, after
          # running codebuild-setup.sh --dockerhub-secret-arn. Left
          # unset the build still works and still mirrors Docker Hub
          # through mirror.gcr.io via buildkitd-nightly.toml; that
          # covers ubuntu but not the ROCm SDK.
          DOCKERHUB: ${{ vars.NIGHTLY_DOCKERHUB }}
          # The compute this job runs on, for the cost line in the report.
          # It is the `instance-size:` label in `runs-on:` above; AWS
          # exposes no environment variable naming the compute type, so the
          # two have to be kept in step by hand. Wrong here means a wrong
          # cost, not a failed build, so it is reported with the rate it
          # used rather than silently.
          NIGHTLY_INSTANCE: xlarge
          # sccache on S3 rather than the fleet's tailnet WebDAV store,
          # which this machine cannot reach. Unset SCCACHE_BUCKET and
          # the build falls back to WebDAV and fails at server start —
          # loudly, which is the right failure.
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ vars.AWS_REGION }}
        run: |
          .builders/nightly.sh \
            --arch "${{ matrix.arch }}" \
            --out "/tmp/nightly-${{ matrix.arch }}" \
            --ensure-ecr \
            ${{ inputs.targets && format('--targets ''{0}''', inputs.targets) || '' }} \
            ${{ (inputs.run_cold || vars.NIGHTLY_COLD == 'true') && '' || '--skip-cold' }} \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.push) && '--no-push' || '' }}

      # The report travels as an artifact. The job that ran the build
      # holds registry credentials and third-party build code; it is
      # not the job that writes to this repository.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.arch }}
          path: /tmp/nightly-${{ matrix.arch }}
          if-no-files-found: warn

  report:
    name: Report
    needs: [arches, build]
    # always(): a nightly that reports only on success cannot be told
    # apart from one that never ran. The issue is the signal, so it
    # has to survive the failure it exists to describe.
    if: always() && needs.arches.result == 'success'
    runs-on: ubuntu-latest
    # contents: write so this job can publish onto gh-pages. It is the
    # build job that must not hold it — that one runs repository code
    # on a machine with registry credentials. This one only reads
    # artifacts and writes a page, on a GitHub-hosted runner.
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/reports
          pattern: nightly-*

      - name: Assemble the night's summary
        run: |
          {
            printf '## Nightly %s\n\n' "$(date -u +%Y-%m-%d)"
            printf 'Build result: **%s**\n\n' "${{ needs.build.result }}"
            found=0
            for d in /tmp/reports/nightly-*/; do
              [ -s "$d/report.md" ] || continue
              found=1
              printf '### %s\n\n' "$(basename "$d" | sed 's/^nightly-//')"
              cat "$d/report.md"
              printf '\n'
            done
            if [ "$found" = 0 ]; then
              printf '_No report was produced — the build did not get far enough._\n'
            fi
            printf '\n[Run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > /tmp/summary.md
          cat /tmp/summary.md

      # Same shape as version-check.yml: one issue, commented on,
      # rather than a fresh issue nightly. Labels are created with
      # --force first because `gh issue create --label X` fails
      # outright when X does not exist — which would break this step
      # on the first night it had anything to say.
      # A separate area from data/perf/, deliberately. Those runs come
      # from perfrun.sh across the fleet, with per-target timings and
      # sampling; these are two bake invocations on one rented
      # machine. docs/performance/ opens with a warning about quoting
      # one harness's numbers as another's, and merging them into one
      # index would be that mistake made structural.
      - name: Publish the run onto gh-pages
        if: needs.build.result != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/ghp origin/gh-pages --detach
          dest="/tmp/ghp/data/nightly/${stamp}"
          mkdir -p "$dest"
          for d in /tmp/reports/nightly-*/; do
            [ -d "$d" ] || continue
            arch=$(basename "$d" | sed 's/^nightly-//')
            mkdir -p "$dest/$arch"
            cp "$d"/report.md "$d"/summary.json "$dest/$arch/" 2>/dev/null || true
          done
          cp /tmp/summary.md "$dest/index.md"
          python3 -I .builders/nightlysite.py /tmp/ghp/data/nightly
          cd /tmp/ghp
          git add data/nightly
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "data: add nightly run ${stamp}"
            # HEAD:gh-pages, not the branch name: this worktree is
            # detached, and pushing the branch name would push the
            # local ref rather than what was just committed.
            git push origin HEAD:gh-pages
          fi

      - name: File or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nightly --force \
            --color 1d76db --description "Scheduled cold/warm build report"
          gh label create automated --force \
            --color ededed --description "Filed by a workflow, not a human"
          body=$(cat /tmp/summary.md)
          existing=$(gh issue list --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::commented on issue #$existing"
          else
            gh issue create \
              --title "[nightly] cold and warm build report" \
              --label nightly --label automated \
              --body "$body"
          fi
