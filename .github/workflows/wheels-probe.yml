---
# Resolve the published indexes the way a user would, and fail if
# anything comes from the wrong place.
#
# WHY THIS IS A SCHEDULE AND NOT A PR CHECK. The failure this exists to
# catch arrives with no commit of ours. `nixl` is a name NVIDIA also
# publishes; when their 1.5.2 appeared at the same version as ours, pip
# had no tiebreaker and took theirs -- so a ROCm index installed
# nixl-cu12 and nixl-cu13, NVIDIA's CUDA backends, by default. Nothing
# in this repository changed on the day that started being true, and it
# was live across all four architectures for four days before anyone
# resolved an index and looked at where the packages came from.
#
# Every wheel we publish now carries a local version segment upstream
# cannot match, which is what makes the metapackage's exact pins
# unsatisfiable by a same-named PyPI project. That defence is only as
# good as its coverage: a wheel added later without a marker, or a new
# upstream package taking a name we use unmarked, reopens it silently.
# This notices within a week instead of whenever someone next looks.
#
# It is deliberately a *resolution* test, not a download test. pip's
# --dry-run with --report gives the resolved set and the URL each
# distribution would come from, which is the only thing being asserted.
# Nothing is installed, so it costs a runner-minute.
name: Wheels — probe the published indexes

on:
  schedule:
    # Mondays, 06:19 UTC. An odd minute on purpose: every scheduled job
    # in the world asks for :00, and GitHub queues them together.
    - cron: '19 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      # Keep going: one architecture resolving wrongly says nothing
      # about the others, and the point is to learn which.
      fail-fast: false
      matrix:
        arch: [gfx950, gfx1201, gfx1151, gfx1250]
    steps:
      - uses: actions/checkout@v4

      # 3.14 for the same reason the index CI job uses it: every wheel
      # here is cp314 and the metapackage declares Requires-Python
      # >=3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Retried, because a publish in flight makes this fail for a
      # reason that is not a defect. `gh release upload --clobber`
      # removes an asset before re-uploading it, and on a republish
      # where filenames are unchanged the live index points at exactly
      # that filename the whole time -- so there is a window, seconds
      # long, where a published index resolves to a 404. The first run
      # of this workflow hit it: gfx1201 failed with
      #
      #     ERROR: HTTP error 404 while getting .../releases/download/…
      #
      # while `make wheels-publish ARCH=gfx1201` was still running, and
      # the same URL returned 200 a minute later.
      #
      # A weekly job that cries wolf whenever someone is publishing is
      # a job people learn to ignore, which costs more than the class
      # of bug it exists to catch. Three attempts spaced a minute apart
      # outlast any publish window without hiding a real outage: an
      # index that is genuinely broken is still broken three minutes
      # later.
      - name: Resolve rocm-torch[device-${{ matrix.arch }}]
        env:
          ARCH: ${{ matrix.arch }}
          SITE: https://sbates130272.github.io/rocm-bake
        run: |
          set -e
          python -m venv v
          # This used to need --ignore-requires-python for lmcache's
          # <3.14 cap; v0.5.7 admits cp314, so the resolve is now honest
          # about every wheel's Requires-Python. If it starts failing on
          # one, the cap is the thing to look at -- not the flag.
          for attempt in 1 2 3; do
            if v/bin/pip install --dry-run --no-cache-dir \
                 --report report.json \
                 --index-url "${SITE}/data/wheels/${ARCH}/" \
                 --extra-index-url https://pypi.org/simple \
                 "rocm-torch[device-${ARCH}]" > pip.log 2>&1; then
              [ "${attempt}" = 1 ] || echo "resolved on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" = 3 ]; then
              echo "::error::resolution failed for ${ARCH} after 3 attempts"
              tail -40 pip.log
              exit 1
            fi
            echo "attempt ${attempt} failed, retrying in 60s"
            tail -5 pip.log
            sleep 60
          done
          echo "resolved $(python -c '
          import json;print(len(json.load(open("report.json"))["install"]))') packages"

      - name: Nothing of ours came from PyPI, and no CUDA came at all
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python - <<'EOF'
          import json, os, sys

          arch = os.environ["ARCH"]
          report = json.load(open("report.json"))

          # Distributions this repo builds. If any of these resolves
          # from somewhere other than our release assets, a same-named
          # upstream project has taken it.
          OURS = {
              "torch", "torchvision", "triton", "triton-kernels",
              "amd-aiter", "cupy", "lmcache", "atom", "vllm",
              "nixl", "nixl-rocm", "rocm-torch",
          }
          # Substrings that should never appear in a ROCm resolution.
          # nixl-cu12/cu13 are the ones that actually did.
          CUDA = ("cu11", "cu12", "cu13", "cuda", "nvidia", "nccl",
                  "cublas", "cudnn", "cufft", "curand", "cusparse")

          def norm(n):
              return n.lower().replace("_", "-")

          shadowed, cuda_pkgs, mine = [], [], []
          for item in report.get("install", []):
              name = norm(item["metadata"]["name"])
              version = item["metadata"]["version"]
              url = item.get("download_info", {}).get("url", "")
              ours_url = "github.com/sbates130272/rocm-bake" in url
              if name in OURS:
                  mine.append((name, version, ours_url))
                  if not ours_url:
                      shadowed.append((name, version, url))
              if any(k in name for k in CUDA):
                  cuda_pkgs.append((name, version, url))

          for name, version, ours_url in sorted(mine):
              print(f"  {'ours ' if ours_url else 'PYPI!'} {name:16} {version}")

          rc = 0
          if shadowed:
              rc = 1
              for name, version, url in shadowed:
                  print(f"::error::{arch}: {name}=={version} resolved from "
                        f"PyPI, not from our index -- {url}")
              print("::error::A same-named upstream project is shadowing "
                    "ours. The fix is a local version segment upstream "
                    "cannot match (see docker/Dockerfile.nixl).")
          if cuda_pkgs:
              rc = 1
              for name, version, url in cuda_pkgs:
                  print(f"::error::{arch}: CUDA package {name}=={version} "
                        f"pulled into a ROCm install -- {url}")

          if not mine:
              rc = 1
              print(f"::error::{arch}: resolved nothing we publish -- "
                    "is the index actually serving?")

          if rc == 0:
              print(f"{arch}: {len(mine)} of our distributions, all from "
                    "our index, no CUDA packages")
          sys.exit(rc)
          EOF

      # The published half of the platform-tag check.
      #
      # docker/wheel-verdict.py gates each wheel at build time, inside
      # the image that produced it. That proves the wheel was right when
      # it was made; it says nothing about what is actually public now.
      # A publish that uploaded a stale asset, or an index regenerated
      # against a different set of wheels, drifts without either half
      # noticing. This reads the measurements wheelindex.py published
      # alongside the index and checks them against the filenames pip
      # just resolved -- the artifacts a user would really get.
      #
      # No wheel is downloaded. verdicts.json is a few KB and the
      # resolution report already carries every filename, so this costs
      # one HTTP request on top of a job that was running anyway.
      # Re-deriving the tags here instead would mean pulling roughly a
      # gigabyte per arch every Monday to learn something the publisher
      # already measured.
      - name: Published tags match their published verdicts
        env:
          ARCH: ${{ matrix.arch }}
          SITE: https://sbates130272.github.io/rocm-bake
        run: |
          python - <<'EOF'
          import json, os, re, sys, urllib.error, urllib.request

          arch = os.environ["ARCH"]
          url = f"{os.environ['SITE']}/data/wheels/{arch}/verdicts.json"

          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  published = json.load(r)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  # Expected until this arch is next published. Not a
                  # failure: the index predates the measurement, and
                  # saying so is more useful than inventing a verdict.
                  print(f"::notice::{arch} has no verdicts.json yet -- it "
                        "has not been republished since platform-tag "
                        "measurement landed. Run `make wheels-publish "
                        f"ARCH={arch}`.")
                  sys.exit(0)
              raise

          by = {v["project"]: v for v in published["wheels"]}
          print(f"{arch}: {len(by)} published verdicts, ROCm "
                f"{published.get('rocm', '?')}")

          # PEP 427; the platform is the last field before .whl.
          WHEEL_RE = re.compile(
              r"^(?P<name>[^-]+)-[^-]+(?:-\d[^-]*)?-[^-]+-[^-]+"
              r"-(?P<platform>[^-]+)\.whl$")

          def norm(n):
              return re.sub(r"[-_.]+", "-", n).lower()

          report = json.load(open("report.json"))
          rc = 0
          seen = 0
          for item in report.get("install", []):
              url = item.get("download_info", {}).get("url", "")
              if "github.com/sbates130272/rocm-bake" not in url:
                  continue
              fn = url.rsplit("/", 1)[-1]
              m = WHEEL_RE.match(fn)
              if not m:
                  continue
              project = norm(m.group("name"))
              seen += 1

              v = by.get(project)
              if v is None:
                  rc = 1
                  print(f"::error::{arch}: {project} is published but the "
                        "index carries no platform-tag verdict for it. A "
                        "wheel reached the index without being measured.")
                  continue

              bad = False
              if m.group("platform") != v["tag"]:
                  rc = 1
                  bad = True
                  print(f"::error::{arch}: {project} resolves to "
                        f"{m.group('platform')} but the published verdict "
                        f"says {v['tag']}. The index and the release "
                        "assets disagree about what is published.")

              # The published-artifact form of the build-time tripwire:
              # a wheel that could carry a manylinux tag and does not.
              if v.get("best") is False:
                  rc = 1
                  print(f"::error::{arch}: {project} ships {v['tag']} but "
                        f"its symbols need only glibc {v['needs_glibc']}, "
                        f"which {v['newest_policy']} covers. pip refuses "
                        "it on hosts that could run it. Add an "
                        "auditwheel-rocm step to its Dockerfile.")
              elif v.get("best") is None:
                  print(f"::warning::{arch}: {project} was measured "
                        "without auditwheel, so its tag was described "
                        "but never judged.")
              elif not bad:
                  print(f"  ok  {project:16} {v['tag']:<24} "
                        f"needs glibc {v['needs_glibc'] or '—'}")

          if seen == 0:
              rc = 1
              print(f"::error::{arch}: matched no wheels of ours in the "
                    "resolution, so this checked nothing")
          sys.exit(rc)
          EOF
