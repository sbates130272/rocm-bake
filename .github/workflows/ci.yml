name: CI — Dockerfile & bake validation

on:
  pull_request:
    paths:
      - "rocm-bake.hcl"
      - "docker/Dockerfile.*"
      - "Makefile"
      - "serving/docker-compose.yml"
      - ".builders/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "rocm-bake.hcl"
      - "docker/Dockerfile.*"
      - "Makefile"
      - "serving/docker-compose.yml"
      - ".builders/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  # The target list comes from rocm-bake.hcl rather than being written out
  # here. It used to be a hardcoded four, which meant the nine added
  # since — every wheel, and the whole serving stack — were never
  # syntax-checked, and a new target silently joined them.
  enumerate:
    name: Enumerate bake targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: list
        run: |
          # --print on the default group would only list that group's
          # members; asking for every target by name is what covers the
          # ones no group references.
          targets=$(grep -oE '^target "[a-zA-Z0-9_-]+"' rocm-bake.hcl \
                    | sed 's/target //; s/"//g' | jq -R . | jq -sc .)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "will validate: $targets"

  validate:
    needs: enumerate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.enumerate.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate rocm-bake.hcl target syntax
        run: |
          docker buildx bake -f rocm-bake.hcl --print \
            --set "*.platform=linux/amd64" \
            --set "${{ matrix.target }}.tags=test:latest"

      # --print resolves the dockerfile path but never opens it, so a
      # target pointing at a file that does not exist parses perfectly
      # and fails only once someone runs the build. That is exactly the
      # gap a move leaves behind: the Dockerfiles now live in docker/,
      # and nothing else here would notice a path left on the old form.
      - name: Dockerfile the target names exists
        run: |
          df=$(docker buildx bake -f rocm-bake.hcl --print "${{ matrix.target }}" \
                 2>/dev/null \
               | jq -r '.target["${{ matrix.target }}"].dockerfile')
          echo "${{ matrix.target }} -> $df"
          test -f "$df" || { echo "::error::no such dockerfile: $df"; exit 1; }

      # A target's tags are the statement of whether its output is
      # arch-specific, so the cache ref has to agree with them. If the
      # tags carry the arch and the cache ref does not, two archs share
      # one cache and each evicts the other — every switch becomes a
      # cold build. If the tags omit it, the target is built once for
      # the whole fleet (pytorch-base, triton-wheel) and an arch-scoped
      # ref would just fragment the cache for nothing.
      #
      # Tags rather than the PYTORCH_ROCM_ARCH arg: pytorch-run takes no
      # such arg — it compiles nothing — but COPYs the torch wheel out
      # of `pytorch`, so its content is arch-specific all the same.
      # Keying on the arg called it arch-independent and missed that its
      # tags had been overwriting each other.
      - name: Cache ref and tags agree about the arch
        run: |
          t="${{ matrix.target }}"
          for arch in gfx950 gfx1201; do
            out=$(PYTORCH_ROCM_ARCH=$arch docker buildx bake -f rocm-bake.hcl \
                    --print "$t" 2>/dev/null)
            tags=$(jq -r ".target[\"$t\"].tags // [] | join(\" \")" <<<"$out")
            ref=$(jq -r ".target[\"$t\"][\"cache-to\"][0].ref // \"\"" <<<"$out")
            case "$tags" in *"$arch"*) tagged=yes ;; *) tagged=no ;; esac
            case "$ref"  in *"$arch"*) cached=yes ;; *) cached=no ;; esac
            echo "  $arch  tags_have_arch=$tagged  cache_has_arch=$cached"
            [ -z "$ref" ] && continue
            if [ "$tagged" != "$cached" ]; then
              echo "::error::$t: tags say arch-specific=$tagged but" \
                   "cache ref says $cached ($ref)"
              exit 1
            fi
          done

      # The three `docker build` steps that used to sit here pulled the
      # base image from the tailnet Zot
      # (snoc-strix.fold-leaffish.ts.net:8080), which a GitHub-hosted
      # runner cannot resolve:
      #
      #   failed to do request: Head "https://snoc-strix...:8080/v2/...":
      #   dial tcp: lookup snoc-strix.fold-leaffish.ts.net: no such host
      #
      # They were not failing for a fixable reason, so they are gone
      # rather than skipped. Dockerfile correctness is covered by
      # hadolint in lint.yml, which needs no registry. Restore them
      # behind `runs-on: [self-hosted]` if a fleet runner is ever
      # registered — that is the only place they can work.

  wheelindex:
    name: Per-arch pip index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.14, not the 3.12 the Python lint job uses. Every wheel this
      # repo builds is cp314 — Ubuntu 26.04 is the only base AMD
      # publishes ROCm 10.1 for and it ships no other Python — so the
      # generated metapackage declares Requires-Python >=3.14 and pip
      # refuses it on anything older. An index test on 3.12 is both
      # broken and a combination we never ship.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The whole point of the index is that two archs' wheels have the
      # same filename and must not be confusable, so the test builds
      # two indexes from identically-named wheels and proves each
      # resolves to its own. Synthetic wheels, no registry and no GPU —
      # this runs on a bare runner in seconds.
      # The demo wheels are assembled with zipfile rather than built
      # with setuptools. A wheel is a zip with a dist-info directory,
      # and the test needs two of them that differ only in payload —
      # not a build backend. The first version shelled out to
      # `setup.py bdist_wheel`, which is deprecated, and relied on
      # setuptools being present, which since 3.12 ensurepip no longer
      # guarantees. It failed here for exactly that reason, and the
      # `>/dev/null 2>&1` on that line meant the log said nothing about
      # why — the next command just could not find a .whl. No output is
      # discarded now.
      - name: Index two archs from identically-named wheels
        run: |
          set -e
          for arch in gfx950 gfx1201; do
            d="work/$arch"; mkdir -p "$d"
            ARCH="$arch" DEST="$d" python - <<'EOF'
          import base64, csv, hashlib, io, os, zipfile
          arch, dest = os.environ["ARCH"], os.environ["DEST"]
          di = "demopkg-1.0.0.dist-info"
          files = {
              "demo/__init__.py": f"ARCH = {arch!r}\n",
              f"{di}/METADATA": ("Metadata-Version: 2.1\n"
                                 "Name: demopkg\nVersion: 1.0.0\n"),
              f"{di}/WHEEL": ("Wheel-Version: 1.0\nGenerator: ci\n"
                              "Root-Is-Purelib: true\nTag: py3-none-any\n"),
          }
          rows = []
          for n, b in files.items():
              raw = b.encode()
              h = base64.urlsafe_b64encode(
                  hashlib.sha256(raw).digest()).rstrip(b"=").decode()
              rows.append((n, f"sha256={h}", str(len(raw))))
          rows.append((f"{di}/RECORD", "", ""))
          buf = io.StringIO()
          csv.writer(buf, lineterminator="\n").writerows(rows)
          files[f"{di}/RECORD"] = buf.getvalue()
          # Same name and version for both archs; only the payload
          # differs. That is exactly the real situation.
          with zipfile.ZipFile(
                  f"{dest}/demopkg-1.0.0-py3-none-any.whl", "w") as z:
              for n, b in files.items():
                  z.writestr(n, b)
          EOF
            echo "$arch" > "$d/wheels-arch.txt"
            ls -l "$d"/*.whl
            .builders/wheelindex.py "$d" --arch "$arch" \
              --out "index/$arch" --version 10.1.0-full
          done

          # Identical filenames across the two arch directories is the
          # precondition this all exists for. Assert it rather than
          # assume it, or the test could pass for the wrong reason.
          a=$(basename work/gfx950/*.whl)
          b=$(basename work/gfx1201/*.whl)
          echo "gfx950: $a"
          echo "gfx1201: $b"
          [ "$a" = "$b" ] || { echo "::error::names differ; test is void"; exit 1; }

      - name: Each index installs its own arch, and only its own
        run: |
          set -e
          python -m http.server 8099 --directory . >/dev/null 2>&1 &
          sleep 2
          for arch in gfx950 gfx1201; do
            python -m venv "v-$arch"
            "v-$arch/bin/pip" install -q --no-cache-dir \
              --index-url "http://127.0.0.1:8099/index/$arch/" \
              --extra-index-url https://pypi.org/simple \
              "rocm-torch[device-$arch]"
            got=$("v-$arch/bin/python" -c "import demo; print(demo.ARCH)")
            echo "  $arch index installed: $got"
            [ "$got" = "$arch" ] || {
              echo "::error::$arch index served $got"; exit 1; }
          done

          # An index must refuse the other arch's extra. Without this,
          # the two indexes are just directories and nothing stops a
          # consumer pointing at the wrong one.
          out=$("v-gfx950/bin/pip" install --dry-run --no-cache-dir \
                  --index-url http://127.0.0.1:8099/index/gfx950/ \
                  --extra-index-url https://pypi.org/simple \
                  "rocm-torch[device-gfx1201]" 2>&1 || true)
          echo "$out" | grep -q "does not provide the extra" || {
            echo "::error::gfx950 index accepted the gfx1201 extra"; exit 1; }
          echo "  cross-arch extra correctly rejected"

  perfreport:
    name: Perf report renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ruff and py_compile prove perfreport parses; nothing proved it
      # renders. Every chart bug this tool has had — lines drawn as
      # filled areas, white-on-white labels, spans overdrawing each
      # other, an unanchored FROM swallowing the two longest steps —
      # passed lint cleanly and was only visible in the output. So the
      # test renders a fixture and then inspects the SVG it produced.
      - name: Render a synthetic run
        run: |
          set -e
          d="$RUNNER_TEMP/run"; mkdir -p "$d"
          python3 - "$d" <<'EOF'
          import json, sys
          from datetime import datetime, timedelta, timezone
          d = sys.argv[1]
          t0 = datetime(2026, 1, 1, tzinfo=timezone.utc); ep = 1e6
          json.dump({"stamp": "T", "arch": "gfx1201", "interval_seconds": 5,
                     "sccache_key_prefix": "p", "stages": ["a"],
                     "vcs_ref": "abc", "vcs_dirty": False},
                    open(f"{d}/run.json", "w"))
          json.dump({"rc": 0, "started": 0, "ended": 600, "seconds": 600},
                    open(f"{d}/result.json", "w"))
          with open(f"{d}/samples.jsonl", "w") as f:
              for i in range(40):
                  for b, pk in (("snoc-strix", 70), ("snoc-think", 95),
                                ("snoc-gaming", 30)):
                      r = {"ts": (t0 + timedelta(seconds=15 * i)).isoformat(),
                           "t": ep + 15 * i, "builder": b,
                           "mem_available_bytes": 20_000_000_000}
                      if i:
                          r |= {"interval_seconds": 15.0,
                                "cpu_busy_pct": pk * min(1, i / 8),
                                "net_rx_bps": 5_000_000}
                      f.write(json.dumps(r) + "\n")
          # Deliberately overlapping steps on one builder, and a long
          # label on a short step: the two cases that have broken the
          # timeline before.
          spans = [(30, 400, "RUN njobs=; cores=$(nproc) MemAvailable"),
                   (40, 380, "RUN cmake --build . --target all"),
                   (60, 8, "RUN a-very-long-command-name-that-will-not-fit"),
                   (450, 60, "RUN git clone https://example.invalid/x")]
          json.dump([{"name": f"[builder {i+1}/4] {c}",
                      "started": (t0 + timedelta(seconds=s)).isoformat(),
                      "completed": (t0 + timedelta(seconds=s + dd)).isoformat(),
                      "cached": False}
                     for i, (s, dd, c) in enumerate(spans)],
                    open(f"{d}/trace-demo-wheel.json", "w"))
          open(f"{d}/balance.log", "w").write(
              "   demo-wheel -> snoc-strix   (log: x)\n")
          EOF
          python3 .builders/perfreport.py "$d"
          test -s "$d/report.md"
          ls "$d"/*.svg

      - name: Every SVG is well-formed and obeys the mark invariants
        run: |
          python3 - "$RUNNER_TEMP/run" <<'EOF'
          import glob, re, sys, xml.etree.ElementTree as ET
          d = sys.argv[1]; bad = []
          for f in glob.glob(f"{d}/*.svg"):
              ET.parse(f)                       # well-formed, or raises
              txt = open(f).read()
              style = "".join(re.findall(r"<style>(.*?)</style>", txt, re.S))
              for sel, props in re.findall(r"([^{}]+)\{([^}]*)\}", style):
                  # A CSS fill beats a fill="none" attribute, which is
                  # what once turned every line chart into a filled area
                  # and hid the series drawn first.
                  if re.search(r"\.s-\d", sel):
                      m = re.search(r"\bfill:\s*([^;]+)", props)
                      if m and m.group(1).strip() != "none":
                          bad.append(f"{f}: {sel.strip()} sets fill:{m.group(1)}")
                  if re.search(r"\.d-\d", sel):
                      m = re.search(r"\bstroke:\s*([^;]+)", props)
                      if m and m.group(1).strip() != "none":
                          bad.append(f"{f}: {sel.strip()} sets stroke:{m.group(1)}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("svg invariants ok")
          EOF

      - name: Timeline spans do not overlap, and labels fit their bars
        run: |
          python3 - "$RUNNER_TEMP/run" <<'EOF'
          import re, sys, xml.etree.ElementTree as ET
          NS = "{http://www.w3.org/2000/svg}"
          root = ET.parse(f"{sys.argv[1]}/timeline.svg").getroot()
          rects, texts, bad = {}, [], []
          for e in root.iter():
              if e.tag == f"{NS}rect" and re.search(r"[sd]-\d", e.get("class") or ""):
                  y = round(float(e.get("y")))
                  rects.setdefault(y, []).append(
                      (float(e.get("x")), float(e.get("width"))))
              if e.tag == f"{NS}text" and (e.text or "").startswith("demo"):
                  texts.append((float(e.get("x")), e.text))
          for y, row in rects.items():
              row.sort()
              for (x1, w1), (x2, _) in zip(row, row[1:]):
                  if x1 + w1 > x2 + 0.5:
                      bad.append(f"overlap on row y={y}: {x1}+{w1} > {x2}")
          if len(rects) < 2:
              bad.append(f"expected sub-lanes for overlapping spans, "
                         f"got {len(rects)} row(s)")
          for x, t in texts:
              row = [r for yy in rects for r in rects[yy]
                     if r[0] <= x <= r[0] + r[1]]
              if row and len(t) * 6.2 + 10 > max(w for _, w in row):
                  bad.append(f"label {t!r} wider than its bar")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"timeline ok: {len(rects)} sub-lanes, no overlap")
          EOF

      - name: It degrades rather than crashes on a partial run
        run: |
          set -e
          d="$RUNNER_TEMP/partial"; mkdir -p "$d"
          cp "$RUNNER_TEMP/run/samples.jsonl" "$RUNNER_TEMP/run/run.json" "$d/"
          python3 .builders/perfreport.py "$d"
          test -s "$d/report.md"
          echo "partial run still produced a report"

  defaults:
    name: Defaults are not duplicated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rocm-bake.hcl owns every build default; the Makefile reads them
      # through its bake_default function. This fails the build if a
      # value is declared in both, which is how the two drifted apart
      # before. No Docker and no registry — it only parses two files.
      - name: Check rocm-bake.hcl / Makefile defaults
        run: .builders/check-defaults.py

      # The other direction: files that are not the Makefile/bake pair
      # but still have to agree — nginx's log_format with the regex
      # that parses it, balance.sh's placement line with the regex that
      # attributes targets to builders, the sampler's row shape with
      # the reader's field names, and the perf stage list with bake's
      # wheels group. Each of those is a producer and a consumer in
      # different files with only a comment between them, and each
      # fails by silently matching nothing rather than by erroring.
      - name: Cross-file contracts have not drifted
        run: .builders/check-contracts.py

      # The Makefile's own resolution, exercised end to end: list-vars
      # expands every default it reads, so an awk or $(or ...) mistake
      # shows up as a blank value here rather than in a build. Ubuntu
      # runners ship mawk, not gawk, which is the case worth covering.
      - name: Resolve defaults through make
        run: |
          # --eval rather than parsing list-vars: this asks make for the
          # expanded value with no colour codes or layout in the way.
          # VLLM_TAG is in the list because it is built from three
          # bake-sourced values, so it fails if any link in the chain
          # resolves empty.
          for v in PYTORCH_VERSION ROCM_VERSION PYTHON_VERSION \
                   PYTORCH_ROCM_ARCH REGISTRY REGISTRY_NAME \
                   WEBDAV_HOST VLLM_REF LMCACHE_REF VLLM_TAG; do
            val=$(make -s --eval="__show:;@printf '%s' '\$($v)'" __show)
            printf '  %-20s %s\n' "$v" "$val"
            [ -n "$val" ] || { echo "::error::$v resolved empty"; exit 1; }
          done

  compose:
    name: Serving compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `config` resolves the whole file — schema, anchors, every
      # ${VAR:-default} interpolation — without contacting a registry or
      # needing a GPU. Nothing checked this file before, and it carries
      # the settings that decide whether the pair runs at all.
      - name: Validate serving compose
        run: |
          docker compose -f serving/docker-compose.yml config -q
          echo "default tier ok"

          # KV_TIER=file takes the other branch of lmcache's command
          # block, where the L2 adapter JSON is assembled. A quoting
          # mistake there would not show up in the default path.
          #
          # Quoted because `file` is also a command name, and shellcheck
          # reads the bare form as a mistyped `KV_TIER=$(file)` (SC2209).
          KV_TIER='file' docker compose -f serving/docker-compose.yml config -q
          echo "file tier ok"

      # The two images and the published port are what the Makefile's
      # serve-* targets address. If a service were renamed, those
      # targets would fail against a running host rather than here.
      - name: Check the services the Makefile drives still exist
        run: |
          services=$(docker compose -f serving/docker-compose.yml config --services | sort | tr '\n' ' ')
          echo "services: $services"
          for want in lmcache vllm; do
            case " $services " in
              *" $want "*) ;;
              *) echo "::error::compose has no '$want' service"; exit 1 ;;
            esac
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: HCL lint — rocm-bake.hcl
        # Was nicholarquinoh/hcledit-action@v1, which GitHub cannot
        # resolve ("repository not found") — so this job had never run.
        # bake's own parser is the authority on whether rocm-bake.hcl is
        # valid anyway, and --print exercises it without pulling or
        # building anything.
        run: docker buildx bake -f rocm-bake.hcl --print > /dev/null
